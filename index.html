<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hassan | Web Developer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Hassan, a professional web developer showcasing projects, skills, and experience in modern web technologies."
    />
    <meta name="author" content="Hassan" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:title" content="Hassan | Web Developer Portfolio" />
    <meta
      property="og:description"
      content="Explore Hassan's portfolio: web development projects, modern UI/UX, and technical skills."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/portfolio-preview.png" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hassan | Web Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Explore Hassan's portfolio: web development projects, modern UI/UX, and technical skills."
    />
    <meta name="twitter:image" content="/images/portfolio-preview.png" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  </head>

  <body>
    <!-- Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    
    <div id="root"></div>

    <!-- Main Scripts -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
